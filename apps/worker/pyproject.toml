[project]
name = "etb-worker"
version = "0.0.0"
description = "EditToolbelt job worker: ffmpeg, DSP and ML processors (docs/01-architecture.md)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.43",
    "modal>=1.6",
    "psycopg[binary]>=3.3",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "structlog>=26.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3",
    "pytest>=9.1",
    "ruff>=0.16",
]

[project.scripts]
etb-worker = "etb_worker.main:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12"
# Supply chain: same one-day minimum release age as pnpm.
exclude-newer = "1 day"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "S",            # bandit (security)
    "SIM", "RUF", "PL", "PT", "RET", "TRY", "BLE", "DTZ",
]
ignore = [
    "PLR2004",  # magic numbers are fine in tests and small helpers
    "TRY003",   # long messages in exceptions are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106", "TRY301"]
"scripts/**" = ["PLR0912"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

# Installed only inside the Modal GPU images (gpu/modal_app.py), never in the worker.
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "spandrel", "spandrel.*", "numpy", "numpy.*", "PIL", "PIL.*", "whisper", "whisper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
