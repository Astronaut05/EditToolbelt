<!doctype html>
<!--
  Stand-in product photo for the Remove Background sample and the design
  screens: a mug on a table, drawn in CSS so the file is ours and license-free.
  Rendered to PNG/JPEG by scripts/samples/render.ts. ?cutout=1 draws the mug
  alone on a transparent background (the expected result).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 880px;
        height: 844px;
        overflow: hidden;
        background: transparent;
      }
      .scene {
        position: absolute;
        inset: 0;
      }
      .wall {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          120% 90% at 18% 12%,
          #f3e6d6 0%,
          #e2cfb8 42%,
          #c9b196 70%,
          #b39a7f 100%
        );
      }
      .table {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 34%;
        background: linear-gradient(180deg, #a88d71, #8f7559);
      }
      .shadow {
        position: absolute;
        left: 34%;
        width: 36%;
        bottom: 25%;
        height: 6%;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(60, 40, 20, 0.55), rgba(60, 40, 20, 0));
      }
      .mug {
        position: absolute;
        left: 35%;
        width: 30%;
        bottom: 28%;
        height: 46%;
      }
      .body {
        position: absolute;
        inset: 6% 0 0 0;
        border-radius: 6% 6% 22% 22% / 4% 4% 14% 14%;
        background: linear-gradient(
          90deg,
          #6f3a22 0%,
          #a85a36 16%,
          #cf7b4f 38%,
          #e79c70 52%,
          #c46e45 74%,
          #8a4629 92%,
          #6a351f 100%
        );
      }
      .rim {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 13%;
        border-radius: 50%;
        background: radial-gradient(
          closest-side,
          #3c1e10 0%,
          #4a2616 62%,
          #b86a43 64%,
          #d98a5f 100%
        );
      }
      .handle {
        position: absolute;
        right: -24%;
        top: 24%;
        width: 34%;
        height: 44%;
        border-radius: 50%;
        border: solid #b1603a;
        border-width: 14px 14px 14px 0;
        border-left-color: transparent;
        clip-path: inset(0 0 0 30%);
      }
      .band {
        position: absolute;
        left: 0;
        right: 0;
        top: 40%;
        height: 9%;
        background: rgba(255, 236, 214, 0.22);
      }
      .cutout .wall,
      .cutout .table,
      .cutout .shadow {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="wall"></div>
      <div class="table"></div>
      <div class="shadow"></div>
      <div class="mug">
        <div class="body"></div>
        <div class="band"></div>
        <div class="rim"></div>
        <div class="handle"></div>
      </div>
    </div>
    <script>
      if (new URLSearchParams(location.search).has('cutout')) document.body.classList.add('cutout');
    </script>
  </body>
</html>
