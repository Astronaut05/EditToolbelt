# Every 30 minutes, from outside: is the worker alive and is the retention
# sweeper running? (CLAUDE.md rule 4: the sweeper is the guarantee.) The
# worker alerts on both itself, but a dead worker can't alert: this run reads
# /readyz/worker and fails when the worker's heartbeat (10 min) or the
# sweeper's last pass (30 min) is too old. GitHub emails about a failed
# scheduled run. On the public site anyone can read those two ages; a private
# site needs CI's Access service token (CF_ACCESS_CLIENT_ID,
# CF_ACCESS_CLIENT_SECRET), and the run fails and says so without it.
# It skips only until SITE_URL is set. Run it by hand from
# Actions → Watch → Run workflow. What to do when it fails:
# docs/runbooks/alerts.md → Watch.
name: Watch

on:
  schedule:
    # Off the hour: GitHub delays scheduled runs at :00 the most.
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watch

jobs:
  worker:
    name: Production · worker heartbeat and sweeper, from outside
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Is the site's address set?
        id: site
        run: |
          if [ -n "$SITE" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SITE_URL (a repository variable) is not set yet: worker check skipped."
          fi
        env:
          SITE: ${{ vars.SITE_URL }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.site.outputs.set == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.site.outputs.set == 'true'
        with:
          node-version-file: .nvmrc
      - name: Worker check
        if: steps.site.outputs.set == 'true'
        run: node scripts/ops/verify.ts
        env:
          OPS_CHECKS: worker
          SITE_URL: ${{ vars.SITE_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
