# The GPU app on Modal (apps/worker/src/etb_worker/gpu/modal_app.py,
# docs/01-architecture.md → GPU backend). Every merge to main that touches it
# deploys it, then calls it. Actions → Modal → Run workflow deploys by hand,
# and "gpu check" also runs a few seconds on a T4. A push to a claude/ops-*
# branch only runs the app's ping once, without deploying (Phase 1 checks).
name: Modal

on:
  push:
    branches: [main, 'claude/ops-**']
    paths:
      - 'apps/worker/src/etb_worker/gpu/**'
      - 'apps/worker/pyproject.toml'
      - 'apps/worker/uv.lock'
      - '.github/workflows/modal.yml'
  workflow_dispatch:
    inputs:
      gpu-check:
        description: Also run a few seconds on a T4 (costs a few GPU-seconds)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: modal-${{ github.ref }}

env:
  UV_VERSION: '0.12.20'

jobs:
  deploy:
    name: Deploy and check the GPU app
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - name: Needs the MODAL_TOKEN_ID and MODAL_TOKEN_SECRET secrets
        id: ready
        working-directory: ${{ runner.temp }}
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::notice::No Modal token: nothing to deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.ready.outputs.ready == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: apps/worker
      - if: steps.ready.outputs.ready == 'true'
        run: uv sync --locked --no-dev
      - name: Ping without deploying (claude/ops-* branches)
        if: steps.ready.outputs.ready == 'true' && github.ref != 'refs/heads/main' && github.event_name == 'push'
        run: uv run modal run -m etb_worker.gpu.modal_app::ping
      - name: Deploy
        if: steps.ready.outputs.ready == 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        run: uv run modal deploy -m etb_worker.gpu.modal_app
      - name: Call the deployed app
        if: steps.ready.outputs.ready == 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        env:
          GPU_CHECK: ${{ inputs.gpu-check && '--gpu' || '' }}
        run: uv run python -m etb_worker.gpu.check $GPU_CHECK
