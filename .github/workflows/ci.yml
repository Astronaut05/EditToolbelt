# CI (docs/12-milestones.md → M0): lint, typecheck, tests, license and host checks on every PR.
# Deploy to Cloudflare Pages on merge to main is dormant until Go public (docs/01 → Hosting).
# Third-party actions are pinned by commit and listed in licenses.json.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'
  UV_VERSION: '0.12.20'

jobs:
  js:
    name: JS · format, lint, typecheck, test, licenses, hosts, build
    runs-on: ubuntu-24.04
    # A normal run takes about 25 minutes (Lighthouse and the static e2e are
    # most of it). A slow apt mirror for Playwright's system packages has
    # added 6 to 28 minutes; 45 leaves room for that.
    timeout-minutes: 45
    services:
      # packages/db's integration tests: migrations, the append-only ledger,
      # the constraints (docs/04). Same image as the local stack.
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: etb
          POSTGRES_PASSWORD: etb-ci-only
          POSTGRES_DB: etb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etb -d etb_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://etb:etb-ci-only@localhost:5432/etb_test
      - name: Migrations are in step with the schema
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/db/migrations || {
            echo "::error::packages/db/src/schema changed without a migration. Run pnpm db:generate and commit it."
            exit 1
          }
      - run: pnpm licenses:check
      - run: pnpm hosts:check
      - name: AI models and ONNX Runtime for Remove Background and Find faces, checksums checked
        run: pnpm models --strict
      - name: Build static export
        run: pnpm build
        env:
          APP_ENV: test
          APP_VERSION: ${{ github.sha }}
      - name: Production build serves the site locally
        run: |
          pnpm --filter @etb/web preview &
          for i in $(seq 1 30); do
            curl -fs http://localhost:4173/ | grep -q 'id="home-search"' && break
            sleep 1
          done
          curl -fs http://localhost:4173/ | grep -q 'id="home-search"'
          curl -fs http://localhost:4173/photo | grep -q 'Photo tools'
          curl -fs http://localhost:4173/upscale-image | grep -q 'noindex'
          curl -fs http://localhost:4173/search-index.json | jq -e '[.[] | select(.kind == "tool")] | length == 75'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4173/does-not-exist)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4173/workshop)" = 404
      # Budgets and end-to-end tests live in this required job, so a PR can't
      # merge past them (docs/10 → Budgets; docs/12 → M1).
      - name: Initial JS budget
        run: pnpm --filter @etb/web js-budget
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Lighthouse budgets (5 pages, mobile emulation)
        run: pnpm lighthouse
      - name: End-to-end (Chromium, Firefox, WebKit, phone) · CSP, isolation, axe, keyboard, links
        run: pnpm e2e
        env:
          APP_ENV: test
      - name: Storage for the server build's tests (the local stack's gateway)
        run: |
          docker run --detach --name storage --publish 7070:7070 --tmpfs /data \
            versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499 \
            --port=:7070 --access=etb-local --secret=etb-local-secret --region=us-east-1 \
            '--cors-allow-origin=*' --quiet posix /data
      - name: End-to-end, server build (Chromium, Firefox, WebKit) · accounts, admin, uploads
        run: pnpm --filter @etb/web e2e:server
        env:
          TEST_DATABASE_URL: postgresql://etb:etb-ci-only@localhost:5432/etb_test

  worker:
    name: Worker · ruff, mypy, pytest, licenses
    runs-on: ubuntu-24.04
    # ffmpeg comes from apt, whose mirror is sometimes slow.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/worker
    services:
      # The scheduler's tests run against the real schema (packages/db's migrations).
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: etb
          POSTGRES_PASSWORD: etb-ci-only
          POSTGRES_DB: etb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etb -d etb_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://etb:etb-ci-only@localhost:5432/etb_test
      TEST_S3_ENDPOINT: http://127.0.0.1:7070
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ffmpeg, Noto fonts, and storage (the local stack's gateway) for the job tests
        working-directory: ${{ github.workspace }}
        run: |
          docker run --detach --name storage --publish 7070:7070 --tmpfs /data \
            versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499 \
            --port=:7070 --access=etb-local --secret=etb-local-secret --region=us-east-1 \
            --quiet posix /data
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends ffmpeg fonts-noto-core
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: apps/worker
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Migrate the test database
        working-directory: ${{ github.workspace }}
        run: |
          pnpm install --frozen-lockfile --filter '@etb/db...'
          DATABASE_URL="$TEST_DATABASE_URL" pnpm --filter @etb/db migrate
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python scripts/check_licenses.py

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: pnpm audit
        run: pnpm audit --audit-level high
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: apps/worker
      - name: pip-audit
        working-directory: apps/worker
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx --from pip-audit==2.10.1 pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"

  stack:
    name: Local stack · docker compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build images
        run: docker compose build
      - name: Start Postgres and storage
        run: docker compose up --detach --wait postgres storage
      - name: Migrations apply to the local stack's database
        run: |
          docker compose run --rm -T migrate
          docker compose exec -T postgres psql -U etb -d etb -tAc \
            "select count(*) from information_schema.tables where table_schema = 'public'" | grep -qx 20
      - name: Worker hello-world job (JSON logs, job succeeds)
        run: |
          set -o pipefail
          docker compose run --rm -T worker python -m etb_worker --once | tee "$RUNNER_TEMP/worker.log"
          jq -e 'select(.event == "job.succeeded") | .service == "worker"' "$RUNNER_TEMP/worker.log"
      - name: Web dev server serves the home page, and is ready (database)
        run: |
          docker compose up --detach web
          for i in $(seq 1 60); do
            if curl -fs http://localhost:3000/ | grep -q 'id="home-search"'; then
              echo "web is up after ~$((i * 2))s"
              curl -fs http://localhost:3000/readyz | jq -e '.checks.database == true'
              curl -fs http://localhost:3000/sign-in | grep -q 'Email me a link'
              exit 0
            fi
            sleep 2
          done
          echo "web did not serve the home page in time"; exit 1
      - name: Worker scheduler writes its heartbeat, runs the daily jobs and emails the digest
        run: |
          docker compose up --detach worker
          sql() { docker compose exec -T postgres psql -U etb -d etb -tAc "$1"; }
          for i in $(seq 1 45); do
            if [ "$(sql "select count(*) from system_checks where name in ('ledger_invariant', 'account_scrub', 'retention_purge', 'daily_digest')")" = 4 ]; then
              echo "scheduler ran after ~$((i * 2))s"
              sql "select count(*) from service_heartbeats where service = 'worker'" | grep -qx 1
              sql "select ok from system_checks where name = 'ledger_invariant'" | grep -qx t
              curl -fs http://localhost:8025/api/v1/messages | jq -e '[.messages[].Subject] | any(startswith("EditToolbelt digest"))'
              exit 0
            fi
            sleep 2
          done
          echo "the scheduler did not run its daily jobs in time"; exit 1
      - name: Web logs are JSON
        # Read the logs first: `grep -m1` straight off `docker compose logs`
        # stops reading early, the writer gets SIGPIPE, and pipefail fails the
        # step whenever more lines follow the match.
        run: |
          set -o pipefail
          logs="$(docker compose logs --no-log-prefix web)"
          grep -m1 '"event":"web.started"' <<<"$logs" | jq -e '.service == "web"'
      - name: Show logs
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down --volumes

  image:
    name: Production web image · builds, starts, refuses pages without Access
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The same Dockerfile Railway builds (.railway/railway.ts). Hosts are
      # reserved test names; nothing here reaches a real service.
      - name: Build
        run: >
          docker build --file apps/web/Dockerfile --tag etb-web
          --build-arg SITE_URL=https://site.example
          --build-arg S3_ENDPOINT=https://storage.example .
      - name: Starts, reports its version, and refuses pages until Access is set up
        run: |
          docker run --detach --name web --publish 8080:8080 \
            --env APP_ENV=production --env APP_VERSION=ci-check \
            --env SITE_URL=https://site.example --env DATABASE_URL=postgresql://none:none@127.0.0.1:1/none \
            --env BETTER_AUTH_SECRET=ci-only-secret-never-used-anywhere-else-00 \
            --env SMTP_URL=smtp://127.0.0.1:1 --env S3_ENDPOINT=https://storage.example \
            --env S3_BUCKET=ci-only --env S3_ACCESS_KEY_ID=ci --env S3_SECRET_ACCESS_KEY=ci \
            etb-web
          for i in $(seq 1 60); do
            curl -fs http://localhost:8080/healthz > /dev/null && break
            sleep 1
          done
          curl -fs http://localhost:8080/healthz | jq -e '.version == "ci-check"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/tools)" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: www.site.example' http://localhost:8080/convert)" = 308
      - name: Show logs
        if: failure()
        run: docker logs web

  # Dormant until Go public (docs/12-milestones.md): without the
  # CLOUDFLARE_API_TOKEN secret the deploy job below is skipped, not failed.
  deploy-gate:
    name: Deploy gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          echo "enabled=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::No CLOUDFLARE_API_TOKEN secret: the site stays local until Go public, deploy skipped."
          fi

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [deploy-gate, js, worker, stack]
    if: needs.deploy-gate.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'edittoolbelt' }}
      # Hosts come from repository variables, never from this file.
      SITE_URL: ${{ vars.SITE_URL }}
      MODELS_BASE_URL: ${{ vars.MODELS_BASE_URL }}
    steps:
      - name: Check deploy settings
        run: |
          missing=""
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID (secret)"
          [ -n "$SITE_URL" ] || missing="$missing SITE_URL (variable)"
          if [ -n "$missing" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is set but these are missing:$missing. See README → Go public."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Build static export
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @etb/web build
        env:
          APP_ENV: production
          APP_VERSION: ${{ github.sha }}
      - name: Deploy with Wrangler
        # Outside the workspace so npx can't touch the repo's package.json or lockfile.
        working-directory: ${{ runner.temp }}
        run: >
          npx --yes wrangler@4.143.0 pages deploy "$GITHUB_WORKSPACE/apps/web/out"
          --project-name="$CF_PAGES_PROJECT" --branch=main
          --commit-hash="$GITHUB_SHA" --commit-message="${GITHUB_SHA::7}"
