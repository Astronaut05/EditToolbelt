# CI (docs/12-milestones.md → M0): lint, typecheck, tests, license and host checks on every PR.
# Deploy to Cloudflare Pages on merge to main is dormant until Go public (docs/01 → Hosting).
# Third-party actions are pinned by commit and listed in licenses.json.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'
  UV_VERSION: '0.12.20'

jobs:
  js:
    name: JS · format, lint, typecheck, test, licenses, hosts, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm licenses:check
      - run: pnpm hosts:check
      - name: Build static export
        run: pnpm build
        env:
          APP_ENV: test
          APP_VERSION: ${{ github.sha }}
      - name: Production build serves the site locally
        run: |
          pnpm --filter @etb/web preview &
          for i in $(seq 1 30); do
            curl -fs http://localhost:4173/ | grep -q 'id="home-search"' && break
            sleep 1
          done
          curl -fs http://localhost:4173/ | grep -q 'id="home-search"'
          curl -fs http://localhost:4173/photo | grep -q 'Photo tools'
          curl -fs http://localhost:4173/remove-background | grep -q 'noindex'
          curl -fs http://localhost:4173/search-index.json | jq -e 'length == 75'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4173/does-not-exist)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4173/workshop)" = 404
      # Budgets and end-to-end tests live in this required job, so a PR can't
      # merge past them (docs/10 → Budgets; docs/12 → M1).
      - name: Initial JS budget
        run: pnpm --filter @etb/web js-budget
      - name: Lighthouse budgets (5 pages, mobile emulation)
        run: pnpm lighthouse
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: End-to-end (Chromium, Firefox, WebKit, phone) · CSP, isolation, axe, keyboard, links
        run: pnpm e2e
        env:
          APP_ENV: test

  worker:
    name: Worker · ruff, mypy, pytest, licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: apps/worker
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python scripts/check_licenses.py

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: pnpm audit
        run: pnpm audit --audit-level high
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: apps/worker
      - name: pip-audit
        working-directory: apps/worker
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx --from pip-audit==2.10.1 pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"

  stack:
    name: Local stack · docker compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build images
        run: docker compose build
      - name: Start Postgres and storage
        run: docker compose up --detach --wait postgres storage
      - name: Worker hello-world job (JSON logs, job succeeds)
        run: |
          set -o pipefail
          docker compose run --rm -T worker python -m etb_worker --once | tee "$RUNNER_TEMP/worker.log"
          jq -e 'select(.event == "job.succeeded") | .service == "worker"' "$RUNNER_TEMP/worker.log"
      - name: Web dev server serves the home page
        run: |
          docker compose up --detach web
          for i in $(seq 1 60); do
            if curl -fs http://localhost:3000/ | grep -q 'id="home-search"'; then
              echo "web is up after ~$((i * 2))s"; exit 0
            fi
            sleep 2
          done
          echo "web did not serve the home page in time"; exit 1
      - name: Web logs are JSON
        run: |
          set -o pipefail
          docker compose logs --no-log-prefix web | grep -m1 '"event":"web.started"' | jq -e '.service == "web"'
      - name: Show logs
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down --volumes

  # Dormant until Go public (docs/12-milestones.md): without the
  # CLOUDFLARE_API_TOKEN secret the deploy job below is skipped, not failed.
  deploy-gate:
    name: Deploy gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          echo "enabled=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::No CLOUDFLARE_API_TOKEN secret: the site stays local until Go public, deploy skipped."
          fi

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [deploy-gate, js, worker, stack]
    if: needs.deploy-gate.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'edittoolbelt' }}
      # Hosts come from repository variables, never from this file.
      SITE_URL: ${{ vars.SITE_URL }}
      MODELS_BASE_URL: ${{ vars.MODELS_BASE_URL }}
    steps:
      - name: Check deploy settings
        run: |
          missing=""
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID (secret)"
          [ -n "$SITE_URL" ] || missing="$missing SITE_URL (variable)"
          if [ -n "$missing" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is set but these are missing:$missing. See README → Go public."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Build static export
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @etb/web build
        env:
          APP_ENV: production
          APP_VERSION: ${{ github.sha }}
      - name: Deploy with Wrangler
        # Outside the workspace so npx can't touch the repo's package.json or lockfile.
        working-directory: ${{ runner.temp }}
        run: >
          npx --yes wrangler@4.143.0 pages deploy "$GITHUB_WORKSPACE/apps/web/out"
          --project-name="$CF_PAGES_PROJECT" --branch=main
          --commit-hash="$GITHUB_SHA" --commit-message="${GITHUB_SHA::7}"
