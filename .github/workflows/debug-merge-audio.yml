# Temporary (claude/debug-merge-audio only, never merged): the WebKit Merge
# Audio hang: the fix, unmodified spec, 8 times over.
name: Debug Merge Audio
on:
  push:
    branches: ['claude/debug-merge-audio']
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build static export
        run: pnpm build
        env:
          APP_ENV: test
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: merge-audio.spec.ts × 8
        run: pnpm --filter @etb/web exec playwright test e2e/merge-audio.spec.ts --repeat-each=8 --reporter=list
        env:
          APP_ENV: test
          PW_BROWSERS: ${{ matrix.browser }}
