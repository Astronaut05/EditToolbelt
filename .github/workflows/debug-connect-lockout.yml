# Temporary (claude/debug-connect-lockout only, never merged): why connect.spec.ts's
# "ten wrong codes lock the account out" times out at its first Decline click
# on Firefox and WebKit. The server e2e setup is copied from ci.yml.
name: Debug connect lockout
on:
  push:
    branches: ['claude/debug-connect-lockout']
permissions:
  contents: read
env:
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  e2e-server:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: before, whole server suite as in CI (1)
            browsers: chromium firefox webkit
            args: ''
            pin: ''
          - name: before, whole server suite as in CI (2)
            browsers: chromium firefox webkit
            args: ''
            pin: ''
          - name: before, whole server suite as in CI (3)
            browsers: chromium firefox webkit
            args: ''
            pin: ''
          - name: before, whole server suite as in CI (4)
            browsers: chromium firefox webkit
            args: ''
            pin: ''
          - name: before, whole server suite as in CI (5)
            browsers: chromium firefox webkit
            args: ''
            pin: ''
          - name: before, whole server suite as in CI (6)
            browsers: chromium firefox webkit
            args: ''
            pin: ''
          - name: before, whole server suite as in CI (7)
            browsers: chromium firefox webkit
            args: ''
            pin: ''
          - name: before, whole server suite as in CI (8)
            browsers: chromium firefox webkit
            args: ''
            pin: ''
          - name: before, whole server suite as in CI (9)
            browsers: chromium firefox webkit
            args: ''
            pin: ''
          - name: before, whole server suite as in CI (10)
            browsers: chromium firefox webkit
            args: ''
            pin: ''
          - name: before, whole server suite as in CI (11)
            browsers: chromium firefox webkit
            args: ''
            pin: ''
          - name: before, whole server suite as in CI (12)
            browsers: chromium firefox webkit
            args: ''
            pin: ''
          - name: before, whole server suite as in CI (13)
            browsers: chromium firefox webkit
            args: ''
            pin: ''
          - name: before, whole server suite as in CI (14)
            browsers: chromium firefox webkit
            args: ''
            pin: ''
          - name: before, whole server suite as in CI (15)
            browsers: chromium firefox webkit
            args: ''
            pin: ''
          - name: before, whole server suite as in CI (16)
            browsers: chromium firefox webkit
            args: ''
            pin: ''
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: etb
          POSTGRES_PASSWORD: etb-ci-only
          POSTGRES_DB: etb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etb -d etb_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: AI models (as in CI, for the whole suite)
        if: contains(matrix.browsers, 'chromium')
        run: pnpm models --strict
      - run: pnpm exec playwright install --with-deps ${{ matrix.browsers }}
      - name: Storage for the server build's tests (the local stack's gateway)
        run: |
          docker run --detach --name storage --publish 7070:7070 --tmpfs /data \
            versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499 \
            --port=:7070 --access=etb-local --secret=etb-local-secret --region=us-east-1 \
            '--cors-allow-origin=*' --quiet posix /data
      - name: e2e:server ${{ matrix.args }}
        working-directory: apps/web
        run: node scripts/e2e-server.ts ${{ matrix.args }}
        env:
          TEST_DATABASE_URL: postgresql://etb:etb-ci-only@localhost:5432/etb_test
          DEBUG_PIN_ADDRESS: ${{ matrix.pin }}
