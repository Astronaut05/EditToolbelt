# Temporary (claude/debug-xbrowser only, never merged): Loop Video's
# boomerang and Audio to Video in WebKit and Firefox, with the specs around
# them, twice each, and the two pages that show what went wrong
# (debug-copyto, debug-audiogram).
name: Debug xbrowser
on:
  push:
    branches: ['claude/debug-xbrowser']
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm build
        env:
          APP_ENV: test
      - run: pnpm --filter @etb/web exec playwright test e2e/debug-copyto e2e/debug-audiogram e2e/loop-video e2e/reverse-video e2e/audio-to-video e2e/rotate-resize-video --repeat-each=2 --reporter=list --project=${{ matrix.browser }}
        env:
          PW_BROWSERS: ${{ matrix.browser }}
