# Production checks from outside (scripts/ops/verify.ts): storage, Cloudflare's
# settings, the site through Cloudflare Access. Each check runs when its
# secrets are set and is skipped otherwise. Run it from Actions → Ops checks →
# Run workflow, or by pushing to a claude/ops-* branch.
# The logs are public (public repo): the script prints outcomes, never values.
name: Ops checks

on:
  workflow_dispatch:
    inputs:
      checks:
        description: Checks to run, comma-separated (empty runs every check whose secrets are set)
        required: false
        default: ''
  push:
    branches: ['claude/ops-**']

permissions:
  contents: read

concurrency:
  group: ops-${{ github.ref }}

jobs:
  verify:
    name: Verify the production setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Checks
        run: node scripts/ops/verify.ts
        env:
          OPS_CHECKS: ${{ inputs.checks }}
          SITE_URL: ${{ vars.SITE_URL }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CF_READ_TOKEN: ${{ secrets.CF_READ_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
