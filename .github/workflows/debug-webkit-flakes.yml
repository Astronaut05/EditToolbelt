# Temporary (claude/debug-webkit-flakes only, never merged): the WebKit
# failures of rotate-resize-video.spec.ts (Download never came on) and
# color-qr.spec.ts (no Network name field), with stage logs and a 250 ms page
# heartbeat (e2e/zz-probe.ts).
name: Debug WebKit flakes
on:
  push:
    branches: ['claude/debug-webkit-flakes']
permissions:
  contents: read
jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # The result <video>'s preload: the browser's default (WebKit: auto) or metadata.
        video_preload: ['', metadata]
    name: framing × 30, 4 workers (video preload ${{ matrix.video_preload || 'default' }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build static export
        run: pnpm build
        env:
          APP_ENV: test
      - run: pnpm exec playwright install --with-deps webkit
      - name: the framing test × 30 on 4 workers, WebKit
        run: pnpm e2e e2e/rotate-resize-video.spec.ts -g framing --repeat-each=30 --workers=4
        env:
          APP_ENV: test
          PW_BROWSERS: webkit
          NEXT_PUBLIC_DEBUG_VIDEO_PRELOAD: ${{ matrix.video_preload }}
  qr:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    name: color-qr.spec.ts × 4 with the early-choice test, main's fields
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build static export
        run: pnpm build
        env:
          APP_ENV: test
      - run: pnpm exec playwright install --with-deps webkit
      - name: color-qr.spec.ts × 4, WebKit
        run: pnpm e2e e2e/color-qr.spec.ts --repeat-each=4
        env:
          APP_ENV: test
          PW_BROWSERS: webkit
