# Temporary (claude/debug-webkit-flakes only, never merged): the fixes of
# claude/fix-webkit-flakes (result <video> preload="metadata", calculator
# fields take in early edits), with the specs as committed there, each 8 times
# in WebKit, with stage logs and a 250 ms page heartbeat (e2e/zz-probe.ts).
name: Debug WebKit flakes
on:
  push:
    branches: ['claude/debug-webkit-flakes']
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    name: the fix, rotate-resize-video.spec.ts and color-qr.spec.ts × 8, WebKit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build static export
        run: pnpm build
        env:
          APP_ENV: test
      - run: pnpm exec playwright install --with-deps webkit
      - name: rotate-resize-video.spec.ts and color-qr.spec.ts × 8, WebKit
        run: pnpm e2e e2e/rotate-resize-video.spec.ts e2e/color-qr.spec.ts --repeat-each=8
        env:
          APP_ENV: test
          PW_BROWSERS: webkit
