packages:
  - apps/*
  - packages/*
  - config

# Supply chain: don't install versions published less than a day ago.
minimumReleaseAge: 1440

# Next.js pulls sharp (libvips, LGPL) as an optional dependency for image
# optimisation. We build a static export with images.unoptimized, so it is
# never used. See docs/13-licenses.md.
ignoredOptionalDependencies:
  - sharp

# drizzle-kit (dev only, `pnpm db:generate`) pulls @esbuild-kit/core-utils,
# which pins esbuild 0.18: below the fix for GHSA-67mh-4wv8-2f99, a flaw in
# esbuild's dev server. We never start that server, but the patched line
# (already in the lockfile for drizzle-kit itself) loads files the same way.
overrides:
  '@esbuild-kit/core-utils>esbuild': 0.25.12

# GHSA-vfj7-8cjw-p6xm (braces <= 3.0.3, stack exhaustion on deeply nested
# patterns) has no fixed version yet. braces reaches us only through
# @next/eslint-plugin-next > fast-glob > micromatch, at lint time, on the
# patterns we write ourselves; nothing in the browser or on a server uses it
# (`pnpm audit --prod` is clean). Remove once a fixed braces is out.
# docs/decisions/2026-10-03-braces-advisory.md
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
