# Local stack: `docker compose up --watch` (docs/12-milestones.md → M0).
#   migrate  applies database migrations, then exits; web and worker wait for it
#   web      http://localhost:3000  Next.js dev server (the server build: accounts), hot reload via compose watch
#   mailpit  http://localhost:8025  catches sign-in and alert emails; nothing leaves your PC
#   worker   Python worker: the hello-world job, then heartbeats, alerts, daily jobs and the digest
#   postgres localhost:5432         user/db `etb`
#   storage  http://localhost:7070  S3-compatible object storage (Versity S3 Gateway)
#
# Every credential here is a local-only placeholder. Real secrets never live in
# this repo (docs/11-security.md → Secrets).
name: edittoolbelt

x-server-env: &server-env
  APP_ENV: local
  APP_VERSION: dev
  LOG_LEVEL: info
  DATABASE_URL: postgresql://etb:etb-local-only@postgres:5432/etb
  S3_ENDPOINT: http://storage:7070
  S3_REGION: us-east-1
  S3_BUCKET: etb-local
  S3_ACCESS_KEY_ID: etb-local
  S3_SECRET_ACCESS_KEY: etb-local-secret

services:
  postgres:
    # 18: built-in uuidv7(), which the data model uses for ids (docs/04).
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: etb
      POSTGRES_PASSWORD: etb-local-only
      POSTGRES_DB: etb
    ports:
      - 127.0.0.1:${ETB_POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U etb -d etb]
      interval: 2s
      timeout: 3s
      retries: 30

  storage:
    # Stands in for Cloudflare R2 locally. Apache-2.0; replaces MinIO, which is
    # AGPL (banned, docs/13-licenses.md) and no longer published as an image.
    image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    command:
      - --port=:7070
      - --access=etb-local
      - --secret=etb-local-secret
      - --region=us-east-1
      # Browsers PUT upload parts here from the dev server (:3000) and the
      # server build's tests (:4175). The bucket is private: a presigned URL is
      # the only way in, so allowing any origin opens nothing more.
      - --cors-allow-origin=*
      - --quiet
      - posix
      - /data
    ports:
      - 127.0.0.1:${ETB_STORAGE_PORT:-7070}:7070
    volumes:
      - storage-data:/data
    healthcheck:
      test: [CMD, nc, -z, 127.0.0.1, '7070']
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    # Same image as web: it has the repo and pnpm. Runs `pnpm db:migrate` once.
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    command: [pnpm, --filter, '@etb/db', migrate]
    environment:
      DATABASE_URL: postgresql://etb:etb-local-only@postgres:5432/etb
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  worker:
    build: ./apps/worker
    init: true
    environment:
      <<: *server-env
      # Alerts and the daily digest (docs/07): email lands in Mailpit. For
      # Telegram, put TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in a .env file
      # next to this one (git-ignored); then email is only the backup.
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: EditToolbelt alerts <alerts@example.test>
      ALERT_EMAIL: ops@example.test
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
      mailpit:
        condition: service_started
    # Same hardening the production worker gets (docs/11-security.md).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    develop:
      watch:
        - action: rebuild
          path: ./apps/worker/src
        - action: rebuild
          path: ./apps/worker/uv.lock

  mailpit:
    # Local SMTP server with a web inbox for the sign-in emails. MIT.
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      - 127.0.0.1:${ETB_MAIL_PORT:-8025}:8025

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    environment:
      # The server build: the site plus accounts, the admin and the API.
      ETB_TARGET: server
      APP_ENV: local
      APP_VERSION: dev
      LOG_LEVEL: info
      SITE_URL: http://localhost:${ETB_WEB_PORT:-3000}
      MODELS_BASE_URL: /models
      DATABASE_URL: postgresql://etb:etb-local-only@postgres:5432/etb
      BETTER_AUTH_SECRET: local-only-auth-secret-never-used-anywhere-else
      SMTP_URL: smtp://mailpit:1025
      # Google sign-in on the local stack: put your own OAuth client in a .env
      # file (never commit it); the button appears when both are set.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Storage for server jobs: the server reaches it as `storage`, your
      # browser as localhost (presigned upload and download URLs).
      S3_ENDPOINT: http://storage:7070
      S3_PUBLIC_ENDPOINT: http://localhost:${ETB_STORAGE_PORT:-7070}
      S3_REGION: us-east-1
      S3_BUCKET: etb-local
      S3_ACCESS_KEY_ID: etb-local
      S3_SECRET_ACCESS_KEY: etb-local-secret
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      storage:
        condition: service_healthy
    ports:
      - 127.0.0.1:${ETB_WEB_PORT:-3000}:3000
    develop:
      watch:
        - action: sync
          path: ./apps/web
          target: /repo/apps/web
          ignore: [node_modules/, .next/, out/, package.json]
        - action: sync
          path: ./packages
          target: /repo/packages
          ignore: ['*/node_modules/', '*/package.json']
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./apps/web/package.json

volumes:
  postgres-data:
  storage-data:
