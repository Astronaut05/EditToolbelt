# Local stack: `docker compose up --watch` (docs/12-milestones.md → M0).
#   web      http://localhost:3000  Next.js dev server, hot reload via compose watch
#   worker   Python worker, runs the hello-world job then idles
#   postgres localhost:5432         user/db `etb`
#   storage  http://localhost:7070  S3-compatible object storage (Versity S3 Gateway)
#
# Every credential here is a local-only placeholder. Real secrets never live in
# this repo (docs/11-security.md → Secrets).
name: edittoolbelt

x-server-env: &server-env
  APP_ENV: local
  APP_VERSION: dev
  LOG_LEVEL: info
  DATABASE_URL: postgresql://etb:etb-local-only@postgres:5432/etb
  S3_ENDPOINT: http://storage:7070
  S3_REGION: us-east-1
  S3_BUCKET: etb-local
  S3_ACCESS_KEY_ID: etb-local
  S3_SECRET_ACCESS_KEY: etb-local-secret

services:
  postgres:
    # 18: built-in uuidv7(), which the data model uses for ids (docs/04).
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: etb
      POSTGRES_PASSWORD: etb-local-only
      POSTGRES_DB: etb
    ports:
      - 127.0.0.1:${ETB_POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U etb -d etb]
      interval: 2s
      timeout: 3s
      retries: 30

  storage:
    # Stands in for Cloudflare R2 locally. Apache-2.0; replaces MinIO, which is
    # AGPL (banned, docs/13-licenses.md) and no longer published as an image.
    image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    command:
      - --port=:7070
      - --access=etb-local
      - --secret=etb-local-secret
      - --region=us-east-1
      - --cors-allow-origin=http://localhost:3000
      - --quiet
      - posix
      - /data
    ports:
      - 127.0.0.1:${ETB_STORAGE_PORT:-7070}:7070
    volumes:
      - storage-data:/data
    healthcheck:
      test: [CMD, nc, -z, 127.0.0.1, '7070']
      interval: 2s
      timeout: 3s
      retries: 30

  worker:
    build: ./apps/worker
    init: true
    environment: *server-env
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
    # Same hardening the production worker gets (docs/11-security.md).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    develop:
      watch:
        - action: rebuild
          path: ./apps/worker/src
        - action: rebuild
          path: ./apps/worker/uv.lock

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    environment:
      APP_ENV: local
      APP_VERSION: dev
      LOG_LEVEL: info
      NEXT_PUBLIC_SITE_URL: http://localhost:${ETB_WEB_PORT:-3000}
    ports:
      - 127.0.0.1:${ETB_WEB_PORT:-3000}:3000
    develop:
      watch:
        - action: sync
          path: ./apps/web
          target: /repo/apps/web
          ignore: [node_modules/, .next/, out/, package.json]
        - action: sync
          path: ./packages
          target: /repo/packages
          ignore: ['*/node_modules/', '*/package.json']
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./apps/web/package.json

volumes:
  postgres-data:
  storage-data:
